<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hub DnD</title>
<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body { 
        font-family: "Comic Sans MS", "Comic Sans", cursive; 
        background: #1a1b1e; 
        color: #e8eaed; 
        margin: 0; 
        padding: 0;
        display: flex; 
        justify-content: center; 
        /* ИЗМЕНЕНО: убрали align-items: center, чтобы контент не висел посередине */
        align-items: flex-start; 
        min-height: 100vh;
        width: 100%;
    }

    .hub-container {
        width: 95%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        /* ИЗМЕНЕНО: минимальный отступ сверху */
        padding: 10px 0 40px 0; 
    }

    h1 {
        font-size: 26px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: #e8eaed;
        /* ИЗМЕНЕНО: уменьшили отступы вокруг заголовка */
        margin: 10px 0 15px 0;
        text-align: center;
        font-weight: bold;
    }

    .nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        background: #2d2f33;
        color: #ffffff;
        min-height: 70px; 
        padding: 12px;
        border-radius: 16px;
        border: 1px solid #3c4043;
        font-size: 18px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: transform 0.1s, background 0.2s;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .nav-btn:active {
        transform: scale(0.95);
        background: #3a3d42;
        border-color: #5f6368;
    }

    /* Цветовая логика */
    .btn-char { border-left: 6px solid #e74c3c; }   
    .btn-inv { border-left: 6px solid #f1c40f; }    
    .btn-alch { border-left: 6px solid #9b59b6; }   
    .btn-magic { border-left: 6px solid #3498db; }  
    .btn-best { border-left: 6px solid #2ecc71; }   

    @media (max-height: 600px) {
        .hub-container { gap: 8px; }
        .nav-btn { min-height: 60px; font-size: 16px; }
        h1 { margin: 5px 0 10px 0; font-size: 22px; }
    }
</style>
</head>
<body>

<div class="hub-container">
    <h1>Hub DnD</h1>

    <a href="https://andrejcepeluk7-oss.github.io/personaj/" class="nav-btn btn-char">
        Персонаж
    </a>

    <a href="https://andrejcepeluk7-oss.github.io/inventar/" class="nav-btn btn-inv">
        Инвентарь
    </a>

    <a href="https://andrejcepeluk7-oss.github.io/alhimia/" class="nav-btn btn-alch">
        Алхимия
    </a>

    <a href="https://andrejcepeluk7-oss.github.io/magic/" class="nav-btn btn-magic">
        Магия
    </a>

    <a href="https://andrejcepeluk7-oss.github.io/bestiari/" class="nav-btn btn-best">
        Бестиарий
    </a>
</div>

</body>
</html>
